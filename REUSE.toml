# Licenses of what has no header (images, fonts, data) and of what comes from
# others. https://reuse.software/spec-3.3/  -  check with: reuse lint
# When several annotations match a file, the last one wins.
version = 1

# Everything in Rewind: GPL-3.0 or later (files with an SPDX header win over
# this). The author's SN seal is not in the repository (see README).
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Sergio Ayala"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Rubik (body and interface). The six static weights are instances of the
# variable font, same license (retro-bauhaus/fonts/OFL.txt).
[[annotations]]
path = ["retro-bauhaus/fonts/Rubik-latin-*.woff2", "docs/modding/fonts/Rubik-latin-*.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2015 The Rubik Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Gugi (titles).
[[annotations]]
path = ["retro-bauhaus/fonts/Gugi-latin.woff2", "docs/modding/fonts/Gugi-latin.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2017 TAE System & Typefaces Co."
SPDX-License-Identifier = "OFL-1.1"

# Funnel Display Light (signature panel).
[[annotations]]
path = "retro-bauhaus/fonts/FunnelDisplay-Light.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2023 The Funnel Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# The OFL notice that travels with the fonts inside the package.
[[annotations]]
path = "retro-bauhaus/fonts/OFL.txt"
precedence = "override"
SPDX-FileCopyrightText = ["2015 The Rubik Project Authors", "2017 TAE System & Typefaces Co.", "2023 The Funnel Project Authors"]
SPDX-License-Identifier = "OFL-1.1"

# Pixel Operator, by Jayvee Enaguas (authorship screen).
[[annotations]]
path = ["retro-bauhaus/fonts/PixelOperator.ttf", "retro-bauhaus/fonts/PixelOperator_CC0.txt",
        "docs/modding/fonts/PixelOperator.ttf", "docs/modding/fonts/PixelOperator_CC0.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2009-2018 Jayvee Enaguas"
SPDX-License-Identifier = "CC0-1.0"

# The 15 paintings of the Art tape: public-domain works, images and data from the
# Art Institute of Chicago open access program (CC0). Credits in THIRD-PARTY.md.
[[annotations]]
path = ["retro-bauhaus/assets/art/*.jpg", "retro-bauhaus/assets/art/manifest.jsonl"]
precedence = "override"
SPDX-FileCopyrightText = "Art Institute of Chicago (images of public-domain works)"
SPDX-License-Identifier = "CC0-1.0"
